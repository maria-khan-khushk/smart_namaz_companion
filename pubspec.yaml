name: smart_namaz_companion
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # ========== UI & Icons ==========
  cupertino_icons: ^1.0.8          # iOS style icons
  flutter_svg: ^2.0.9              # SVG images support (if needed later)

  # ========== Islamic Calendar ==========
  hijri_date: ^1.0.1               # Islamic (Hijri) date calculation
  table_calendar: ^3.0.9           # Calendar widget for Streak Tracker

  # ========== Location & Compass (Qibla Direction) ==========
  sensors_plus: ^6.0.1 
  geolocator: ^13.0.2              # Get user's current GPS location (latitude/longitude)
  permission_handler: ^11.3.1      # Request location permission (Android/iOS)
  flutter_compass: ^0.8.0
  # ========== Networking & API ==========
  http: ^1.1.0                     # Fetch prayer times from Aladhan API

  # ========== Local Storage ==========
  shared_preferences: ^2.2.2       # Save user preferences (notifications, theme, streak)
  path_provider: ^2.1.0            # Get temporary/cache directory (for sound files)

  # ========== Notifications & Azan Sound ==========
  flutter_local_notifications: ^17.2.1   # Schedule and display Azan notifications
  audioplayers: ^6.6.0             # Play Azan sound when notification is tapped
  android_alarm_manager_plus: ^4.0.3
  
  # ========== Date, Time & Timezone ==========
  timezone: ^0.9.4                 # Handle timezone for scheduled notifications
  intl: ^0.18.1                    # Format dates, times, and 12-hour conversion

  # ========== State Management ==========
  provider: ^6.0.5                 # Manage app-wide state (theme, language)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  proximity_sensor: ^1.3.10
  flutter_tts: ^4.2.5
  vibration: ^3.1.8
  wakelock_plus: ^1.6.0
  flutter_volume_controller: ^1.3.4
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/azan.mp3
    - assets/hadiths.json
    - assets/logo.png              # Your logo image (used for both icon and splash)

# ========== Launcher Icon Configuration ==========
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"  # Change this to adjust the background of the app icon
  adaptive_icon_foreground: "assets/logo.png" # The logo will be centered on the background
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

# ========== Native Splash Screen Configuration ==========
flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"